# Achter de nginx op de server: diens X-Forwarded-Proto (https) doorgeven, zodat de API de
# login-cookie als Secure markeert. Zonder proxy ervoor: het eigen schema.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Projecten met veel metingen; de API zelf staat 5 MB toe.
    client_max_body_size 6m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    # API op hetzelfde adres: geen CORS nodig, één certificaat.
    # Via een variabele, zodat nginx ook start als de API-container er (nog) niet is.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8080;
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 30s;
    }

    # index.html altijd vers ophalen, zodat een nieuwe versie direct zichtbaar is.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Service worker en manifest: altijd vers, anders blijft een geïnstalleerde app op een oude versie hangen.
    location ~ ^/(ngsw-worker\.js|safety-worker\.js|worker-basic\.min\.js|ngsw\.json)$ {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
    }

    # Bestandsnamen met een hash veranderen bij elke build: lang cachen is veilig.
    location ~* \.(?:js|css|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
